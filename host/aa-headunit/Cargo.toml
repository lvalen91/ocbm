[package]
name = "aa-headunit"
version = "0.1.0"
edition = "2021"
description = "Minimal Android Auto head-unit client: bench-test the AA protocol against a phone's developer head-unit server and capture video. Interop/accessory development (docs/host/02_ANDROID_AUTO.md)."

[[bin]]
name = "aa-headunit"
path = "src/main.rs"

[dependencies]
# Mirror aasdk's SSLWrapper exactly: OpenSSL with manual memory BIOs so TLS
# records can be encapsulated inside Android Auto control frames.
openssl = "0.10"
openssl-sys = "0.9"
foreign-types-shared = "0.1"

[profile.release]
opt-level = 2

[workspace]
