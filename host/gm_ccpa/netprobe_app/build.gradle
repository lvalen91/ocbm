// Top-level build file. AGP 7.4.x + Kotlin 1.7.x — broadly compatible with an Android 12 / API 32 target.
buildscript {
    repositories { google(); mavenCentral() }
    dependencies {
        classpath 'com.android.tools.build:gradle:7.4.2'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.7.20'
    }
}
allprojects {
    // repositories are declared centrally in settings.gradle
}
