// =============================================================================================
// NOT THE CANONICAL BUILD. `tools/build_apk.sh` is the shipping build path — it packages the
// native libcarplayjni.so (this Gradle project does NOT), and without that .so the APK is signed,
// installable, and PAIRING-INCAPABLE. These Gradle files exist for Android Studio editing/indexing
// only. If you must build with Gradle: (a) the jniLibs.srcDirs below expects the .so to have been
// built first by `cargo build --release --target x86_64-linux-android` in native/carplay-jni; and
// (b) the versionCode below is a STUB. Since 2026-09-11 the manifest declares no version at all and
// build_apk.sh injects the real one at link time (code = git commit count, name = "4.0+<STAMP>",
// STAMP = <sha> or <sha>-dirty.<h8>), so a Gradle-built APK always carries a LOWER code than a
// canonically-built one. That is deliberate: it means a Studio build cannot be mistaken for a
// shipping artifact, and `adb install -r` will reject it over a real build rather than silently
// putting unpackaged-native code on the truck.
// =============================================================================================
plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace "zeno.gmccpa"  // the CLASS package; the install id below differs on purpose (2026-10-15)
    compileSdk 32

    defaultConfig {
        // android.car.usb.handler DELIBERATELY again, owner request 2026-10-15 (GM's USB fixed-handler
        // package). Must match INSTALL_PKG in tools/build_apk.sh, which is what actually builds the APK.
        applicationId "android.car.usb.handler"
        minSdk 32          // owner decision OD-4 (2026-10-06): the app targets API 32 (GM Info 3.7) only — was 26
        targetSdk 32       // Android 12 (GM Info 3.7 / API 32)
        versionCode 7        // stub, Studio-only — build_apk.sh injects the real code (commit count)
        versionName "4.0-ide" // marked so a Gradle artifact is identifiable in `dumpsys package`
    }

    sourceSets {
        // The canonical build (build_apk.sh) builds and stores this .so; mirror the path here so a
        // Gradle build at least packages whatever was last cargo-built rather than shipping none.
        main.jniLibs.srcDirs += ["${rootProject.projectDir}/../native/jniLibs"]
        // plan v5.9 MIC — mirrors tools/build_apk.sh's GMCCPA_BENCH switch (documentation only;
        // Gradle is not the build): exactly one of the two BenchHooks source dirs is compiled.
        main.java.srcDirs += [(System.getenv('GMCCPA_BENCH') == '1') ? 'src/bench/java' : 'src/nobench/java']
    }

    buildTypes {
        debug {
            // default debuggable; sideload-friendly
        }
        release {
            minifyEnabled false
            // If minify is ever enabled, MfiRelay's methods are resolved by string name from Rust
            // (call_method "copyCertificate"/"createSignature") and MUST NOT be renamed/stripped.
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = '1.8'
    }
}

dependencies {
    // Intentionally none at runtime. Everything used is in the platform SDK so the APK stays tiny and
    // has no transitive AndroidX/version friction when sideloaded onto a locked user build.
    // Host JVM unit tests only, never packaged: src/test (UsbRequestPolicyTest). They need no Android
    // classes, so they also run without Gradle: kotlinc + this jar, then org.junit.runner.JUnitCore.
    testImplementation 'junit:junit:4.13.2'
}
