[package]
name = "bt-common"
version = "0.1.0"
edition = "2021"
description = "Protocol-agnostic Bluetooth primitives shared by the CarPlay and Android Auto wireless paths: HCI, userspace RFCOMM, a bluetoothd-less SDP server, and the pairing agent."

# Extracted 2026-09-01 from crates/vendor/wireless (carplay-wireless), which had these as private
# modules of a binary. Wireless Android Auto needs the same radio machinery -- it advertises an SDP
# record, accepts an RFCOMM connection and pairs, exactly as the CarPlay arm does -- and the
# alternative was a second copy that would drift. The files moved VERBATIM; the only edit was
# widening `ssp_agent::state_dir` from pub(crate) to pub, because a caller now crosses a crate
# boundary to reach it.
#
# What deliberately did NOT move: sdp_client.rs and bt_bringup.rs (genuinely CarPlay-coupled -- they
# browse for the iAP2 service and sequence the CarPlay bring-up), and control/av/bt_driver/
# wifi_handoff/mfi_local/box_identity/reconnect/arbiter_client (CarPlay session logic).
#
# The `CARPLAY_*` environment variable names inside these modules are retained on purpose. They are
# the deployed contract on a shipping box; renaming them would be a behaviour change dressed up as a
# refactor. New AA-side knobs get their own names.

[dependencies]
libc = "0.2"
